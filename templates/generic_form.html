{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}{{ title }} - driver_docs{% endblock %}
{% block content %}
<h2 class="mb-4">{{ title }}</h2>
<div class="card" style="max-width: 640px;">
    <div class="card-body">
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary mt-2">Зберегти</button>
            <a href="{{ back_url }}" class="btn btn-outline-secondary mt-2">Скасувати</a>
        </form>
    </div>
</div>
{% endblock %}
