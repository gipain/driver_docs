<!DOCTYPE html>
{% load static %}
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}driver_docs{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">driver_docs</a>
        <div class="navbar-nav">
            <a class="nav-link" href="{% url 'partners:counterparty_list' %}">Контрагенти</a>
            <a class="nav-link" href="{% url 'fleet:driver_list' %}">Водії</a>
            <a class="nav-link" href="{% url 'fleet:vehicle_list' %}">Автомобілі</a>
            <a class="nav-link" href="{% url 'fleet:trailer_list' %}">Причепи</a>
            <a class="nav-link" href="{% url 'partners:contract_list' %}">Договори</a>
            <a class="nav-link" href="{% url 'trips:trip_list' %}">Рейси</a>
            <a class="nav-link" href="{% url 'documents:act_list' %}">Акти</a>
            <a class="nav-link" href="{% url 'documents:registry' %}">Реєстр і звіти</a>
            <a class="nav-link" href="/admin/">Адмінка</a>
        </div>
    </div>
</nav>
<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert
                {% if message.tags == 'error' %}alert-danger
                {% elif message.tags == 'warning' %}alert-warning
                {% else %}alert-success{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
