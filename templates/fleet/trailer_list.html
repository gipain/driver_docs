{% extends 'base.html' %}
{% block title %}Причепи - driver_docs{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Причепи</h2>
    <a href="{% url 'fleet:trailer_create' %}" class="btn btn-primary">+ Новий причіп</a>
</div>
<table class="table table-striped bg-white">
    <thead>
        <tr><th>Держ.номер</th><th>Марка / модель</th><th></th></tr>
    </thead>
    <tbody>
        {% for tr in trailers %}
        <tr>
            <td>{{ tr.plate_number }}</td>
            <td>{{ tr.brand_model }}</td>
            <td><a href="{% url 'fleet:trailer_update' tr.pk %}" class="btn btn-sm btn-outline-secondary">Редагувати</a></td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-muted">Причепів ще немає.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
